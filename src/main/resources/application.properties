spring.application.name=api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fivesense}
spring.datasource.username=${DATABASE_USERNAME:fivesense}
spring.datasource.password=${DATABASE_PASSWORD:fivesense-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=${OCCURRENCE_IMAGE_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${OCCURRENCE_IMAGE_MAX_SIZE:5MB}
occurrences.temp-image-dir=${OCCURRENCE_IMAGE_DIR:${java.io.tmpdir}/fivesense-occurrence-images}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
