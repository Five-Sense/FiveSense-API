spring.application.name=api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fivesense}
spring.datasource.username=${DATABASE_USERNAME:fivesense}
spring.datasource.password=${DATABASE_PASSWORD:fivesense-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Port 465 uses implicit SSL (set MAIL_SSL=true); port 587 uses STARTTLS (set MAIL_STARTTLS=true).
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:smtp.gmail.com}
# Without timeouts a dead SMTP host blocks the sending thread forever.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.mvc.problemdetails.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
spring.servlet.multipart.max-file-size=${OCCURRENCE_IMAGE_MAX_SIZE:15MB}
spring.servlet.multipart.max-request-size=${OCCURRENCE_IMAGE_MAX_REQUEST_SIZE:50MB}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Explicit console logging so the platform (Render) always captures app logs on stdout.
logging.level.root=INFO
logging.level.com.fivesense.api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
